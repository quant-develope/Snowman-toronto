    <circle cx="90" cy="125" r="30" fill="#1b2430"/><circle cx="90" cy="125" r="12" fill="#6f7b88"/>
    <circle cx="225" cy="125" r="30" fill="#1b2430"/><circle cx="225" cy="125" r="12" fill="#6f7b88"/>

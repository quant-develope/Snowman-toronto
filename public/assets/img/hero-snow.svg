    <path d="M0 -80l30 8-30 6z" fill="#ff7a3d"/>
    <circle cx="-10" cy="-90" r="3.5" fill="#0b2140"/><circle cx="10" cy="-90" r="3.5" fill="#0b2140"/>
    <path d="M-30 -56c20 12 40 12 60 0l4 12c-10 6-14 16-10 34h-12c-2-14 0-22 6-28-20 4-34 2-48-6z" fill="#e8662f"/>

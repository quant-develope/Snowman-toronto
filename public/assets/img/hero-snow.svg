    <circle cx="820" cy="70" r="1.5"/><circle cx="980" cy="160" r="1.1"/><circle cx="1500" cy="90" r="1.3"/><circle cx="1380" cy="190" r="1"/>
    <circle cx="700" cy="230" r="1.2"/><circle cx="220" cy="260" r="1"/><circle cx="1060" cy="40" r="1.2"/>
  </g>

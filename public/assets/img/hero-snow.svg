    <path d="M0 610V520h60v-40h50v60h40v-90h70v110h30v-70h60v110h40V470h50v60h30v-30h60v110h30v-160h60v170h40v-120h50v70h30V610z"/>
    <path d="M960 610V500h40v-70h60v80h40v-130h70v150h30v-60h50v140h40v-90h60v60h40V430h70v120h40v-60h60v120h40V610z"/>
    <path d="M884 610V330h-8l2-30h-10l6-30 6-4V150h6l2-30 2 30h6v116l6 4 6 30h-10l2 30h-8v280z"/>
